name: Validate archive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build static indexes
        run: python -m scripts.build_site
      - name: Verify generated site data and JavaScript
        run: |
          test -s site/data/catalog.json
          test -s site/data/people.json
          node --check site/app.js
          node --check site/threading.js
