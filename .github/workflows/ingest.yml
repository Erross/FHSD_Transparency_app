name: Ingest uploaded snapshots

on:
  push:
    branches: [main]
    paths:
      - 'incoming/**/*.json'

permissions:
  contents: write

concurrency:
  group: archive-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate before ingest
        run: python -m unittest discover -s tests -v
      - name: Ingest inbox and rebuild public indexes
        run: python -m scripts.ingest_inbox --consume
      - name: Validate generated result
        run: |
          python -m unittest discover -s tests -v
          test -s site/data/catalog.json
          test -s site/data/people.json
          node --check site/app.js
          node --check site/delta.js
          node --check site/threading.js
      - name: Commit archive update
        run: |
          git config user.name 'fhsd-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A archive data site/data incoming
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Ingest public archive snapshot'
            git push
          fi
